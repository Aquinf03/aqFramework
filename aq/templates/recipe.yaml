# Kernel spec. aq does not override this.
# Built-in methods: recipe is enough. No custom Python required.

# --- tabular (scikit-learn / xgboost / lightgbm / catboost) ---
# family: tabular
# method: linear | logistic | ridge | lasso | elasticnet | tree | forest | boosting | gp
# data:
#   path: data.csv
#   target: label
# eval:
#   metric: mse
#   min_score: null

# --- LLM (Hugging Face). model: is required. size: is a label only. ---
family: llm
method: lora
model: meta-llama/Llama-3.2-1B-Instruct
objective: lora
# bits: 4                # QLoRA: CUDA + bitsandbytes only
rank: 16
alpha: 32
steps: 100
lr: 2.0e-4
batch_size: 1
grad_accum: 8
max_seq_len: 512
seed: 0
data:
  path: data.jsonl
  prompt: prompt
  completion: completion
eval:
  metric: loss
  min_score: null

# Unsupported (errors on purpose): formats, speculative, paged_kv
# Optional: guard.safety / guard.leak
